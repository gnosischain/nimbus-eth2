name: Gnosis spec tests

# Runs the consensus-spec reference tests generated with the Gnosis preset
# (published by gnosischain/consensus-specs) against Nimbus, built with
# -d:const_preset=gnosis. Kept separate from the main CI matrix so it does not
# block the core suite and can be iterated on independently.

on:
  push:
    branches:
      - stable
      - gnosis-spec-tests
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  gnosis-spec-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Fix nim cache conflicts
        run: |
          echo "XDG_CACHE_HOME=${{ runner.temp }}/.nim-cache" >> $GITHUB_ENV
          echo "CI_CACHE=${{ runner.temp }}/.nbs-cache" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive environment variables
        run: |
          echo "PLATFORM=x64" >> $GITHUB_ENV
          echo "NIMFLAGS=${NIMFLAGS} -d:limitStackUsage" >> $GITHUB_ENV
          ncpu=$(nproc)
          echo "ncpu=${ncpu}" >> $GITHUB_ENV

      - name: Get latest nimbus-build-system commit hash
        id: versions
        run: |
          nbsHash=$(git rev-parse HEAD:vendor/nimbus-build-system)
          echo "nimbus_build_system=$nbsHash" >> $GITHUB_OUTPUT

      - name: Restore prebuilt Nim from cache
        id: nim-cache
        uses: actions/cache@v4
        with:
          path: NimBinaries
          key: 'nim-linux-amd64-${{ steps.versions.outputs.nimbus_build_system }}-gnosis'

      - name: Build Nim and Nimbus dependencies
        run: |
          make -j ${ncpu} ARCH_OVERRIDE=${PLATFORM} QUICK_AND_DIRTY_COMPILER=1 CI_CACHE=NimBinCache update
          ./env.sh nim --version

      - name: Run Gnosis-preset consensus spec tests
        run: |
          make -j ${ncpu} V=1 test-gnosis

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gnosis Spec Test Results
          path: build/*.xml
          if-no-files-found: ignore
